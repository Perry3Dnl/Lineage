<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Illustrative Lineage tree view example">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f8fb"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui{font-family:Segoe UI,Arial,sans-serif}
      .mono{font-family:Consolas,Menlo,monospace}
      .muted{fill:#64748b}
      .title{fill:#0f172a;font-weight:700}
      .small{font-size:18px}
      .med{font-size:22px}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g class="ui" filter="url(#shadow)">
    <rect x="48" y="36" width="1104" height="648" rx="24" fill="url(#panel)" stroke="#d7dde8"/>
    <rect x="48" y="36" width="1104" height="56" rx="24" fill="url(#head)"/>
    <rect x="48" y="68" width="1104" height="24" fill="url(#head)"/>

    <rect x="94" y="170" width="252" height="60" rx="12" fill="#edf4ff" stroke="#b7d4ff"/>
    <text x="112" y="198" class="small muted">Expression</text>
    <text x="112" y="218" class="mono med" fill="#1459c7">total = subtotal - discount</text>

    <text x="94" y="274" class="title med">Tree Summary</text>
